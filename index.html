<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opportunity Atlas</title>
  <meta name="theme-color" content="#05070c" />
  <meta name="description" content="Explore where freelancers and projects meet, on a globe." />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="globe"></div>

  <header class="hud-brand">
    <span class="hud-brand__mark" aria-hidden="true">◍</span>
    <span>Opportunity Atlas</span>
  </header>

  <div class="hud-status" id="status" aria-live="polite">
    <span>Loading the atlas…</span>
  </div>

  <aside class="hud-card" id="card" hidden role="dialog" aria-label="City details">
    <button class="hud-card__close" id="card-close" aria-label="Close">×</button>
    <h2 class="hud-card__title" id="card-title"></h2>
    <p  class="hud-card__subtitle" id="card-subtitle"></p>
    <ul class="hud-card__stats">
      <li><strong id="card-freelancers">0</strong> freelancers</li>
      <li><strong id="card-projects">0</strong> projects</li>
    </ul>
    <p class="hud-card__hint">Detail panel with talents &amp; projects lands in Chat 3.</p>
  </aside>

  <!-- libs (UMD, load before app.js) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/globe.gl"></script>

  <!-- our scripts -->
  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
